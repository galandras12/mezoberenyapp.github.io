<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mezőberény App</title>
<meta name="description" content="Mezőberény hírei, eseményei, intézményei és elérhetőségei egy helyen.">
<meta name="theme-color" content="#0a66ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a66ff'/><text x='50' y='71' font-size='58' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'>M</text></svg>">
<script>
/* A témát még a CSS betöltése előtt beállítjuk, hogy ne villanjon fel
   egy pillanatra a rossz színséma. A teljes logika az app.js-ben van. */
(function () {
  try {
    var saved = localStorage.getItem('mb.theme');
    if (saved === 'dark' || saved === 'light') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  } catch (error) { /* privát mód: marad a rendszerbeállítás */ }
})();
</script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

      <circle cx="12" cy="12" r="4.4" fill="currentColor"/>

<div class="app">

  <!-- Desktop oldalsó navigáció -->
  <aside class="sidebar">
    <div class="sidebar__head">
      <a class="brand" href="#/hirek">
        <span class="brand__mark" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><use href="#i-building"/></svg>
        </span>
        <span>
          <span class="brand__name">Mezőberény</span><br>
          <span class="brand__sub">Városi alkalmazás</span>
        </span>
      </a>
      <button type="button" class="themetoggle themetoggle--side" data-theme-toggle
              aria-label="Váltás sötét témára" title="Váltás sötét témára">
        <svg class="icon icon--moon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-moon"/></svg>
        <svg class="icon icon--sun" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"/></svg>
      </button>
    </div>
    <nav class="navlist" id="sidebar-nav" aria-label="Fő navigáció"></nav>
    <div class="sidebar__foot" id="sidebar-foot"></div>
  </aside>

  <main class="main" id="view" tabindex="-1"></main>

  <!-- Mobil alsó navigáció -->

</div>

<script src="assets/js/app.js"></script>
</body>
</html>
