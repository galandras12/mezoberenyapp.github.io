<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mezőberény App</title>
<meta name="description" content="Mezőberény hírei, eseményei, intézményei és elérhetőségei egy helyen.">
<meta name="theme-color" content="#0a66ff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a66ff'/><text x='50' y='71' font-size='58' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'>M</text></svg>">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<!-- Ikonkészlet: egyszer definiálva, <use>-zal hivatkozva. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <g id="i-news" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 5h12a1 1 0 0 1 1 1v13H6a2 2 0 0 1-2-2V5Z"/>
      <path d="M17 9h2a1 1 0 0 1 1 1v7a2 2 0 0 1-2 2"/>
      <path d="M7 8h6M7 11.5h6M7 15h4"/>
    </g>
    <g id="i-calendar" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="5" width="17" height="15" rx="3"/>
      <path d="M8 3v4M16 3v4M3.5 10h17M8 14h2M14 14h2M8 17h2"/>
    </g>
    <g id="i-building" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 21h18"/>
      <path d="M5 21V8l7-5 7 5v13"/>
      <path d="M9.5 21v-5h5v5"/>
      <path d="M9 11h1.5M13.5 11H15"/>
    </g>
    <g id="i-phone" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 3.5h2l1.5 4-2 1.4a12.5 12.5 0 0 0 5.6 5.6l1.4-2 4 1.5v2a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.5 5.7a2 2 0 0 1 2-2.2Z"/>
    </g>
    <g id="i-grid" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="7" height="7" rx="2"/>
      <rect x="13.5" y="3.5" width="7" height="7" rx="2"/>
      <rect x="3.5" y="13.5" width="7" height="7" rx="2"/>
      <rect x="13.5" y="13.5" width="7" height="7" rx="2"/>
    </g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/>
    </g>
    <g id="i-bell" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 15V10a6 6 0 1 0-12 0v5l-1.5 2.5h15L18 15Z"/>
      <path d="M10 20a2.2 2.2 0 0 0 4 0"/>
    </g>
    <g id="i-menu" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M4 7h16M4 12h16M4 17h11"/>
    </g>
    <g id="i-back" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 5 8 12l6.5 7"/>
    </g>
    <g id="i-bookmark" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 4h11a1 1 0 0 1 1 1v15l-6.5-4.2L5.5 20V5a1 1 0 0 1 1-1Z"/>
    </g>
    <g id="i-more" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M6 12h.01M12 12h.01M18 12h.01"/>
    </g>
    <g id="i-sliders" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 8h10M18 8h2M4 16h4M12 16h8"/>
      <circle cx="16" cy="8" r="2"/><circle cx="10" cy="16" r="2"/>
    </g>
    <g id="i-shield" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.2 5.5 6v5.5c0 4 2.7 7.4 6.5 8.8 3.8-1.4 6.5-4.8 6.5-8.8V6L12 3.2Z"/>
      <path d="m9.3 12 1.9 1.9 3.5-3.6"/>
    </g>
    <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/>
    </g>
    <g id="i-external" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 4h6v6"/><path d="M20 4 11 13"/>
      <path d="M18 14.5V19a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 19V7.5A1.5 1.5 0 0 1 5.5 6H10"/>
    </g>
    <g id="i-inbox" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 13.5h4l1.5 3h6l1.5-3h4"/>
      <path d="M5.6 5.2h12.8a2 2 0 0 1 1.9 1.4l1.2 6.9v3a2 2 0 0 1-2 2H4.5a2 2 0 0 1-2-2v-3l1.2-6.9a2 2 0 0 1 1.9-1.4Z"/>
    </g>
    <g id="i-pin" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4h6l-.8 5.2 2.8 2.4v1.9H7v-1.9l2.8-2.4L9 4Z"/><path d="M12 13.5V20"/>
    </g>
    <g id="i-alert" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="8.5"/><path d="M12 7.8v4.6M12 16.2h.01"/>
    </g>
    <g id="i-refresh" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4.5V10h-5.5"/>
    </g>
  </defs>
</svg>

<div class="app">

  <!-- Desktop oldalsó navigáció -->
  <aside class="sidebar">
    <a class="brand" href="#/hirek">
      <span class="brand__mark" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24"><use href="#i-building"/></svg>
      </span>
      <span>
        <span class="brand__name">Mezőberény</span><br>
        <span class="brand__sub">Városi alkalmazás</span>
      </span>
    </a>
    <nav class="navlist" id="sidebar-nav" aria-label="Fő navigáció"></nav>
    <div class="sidebar__foot" id="sidebar-foot"></div>
  </aside>

  <main class="main" id="view" tabindex="-1"></main>

  <!-- Mobil alsó navigáció -->
  <nav class="tabbar" id="tabbar" aria-label="Fő navigáció"></nav>
</div>

<script src="assets/js/app.js"></script>
</body>
</html>
